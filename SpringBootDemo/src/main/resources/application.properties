server.port=8080

# Eureka 注册中心配置
spring.application.name=demo
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# MySQL 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/world?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.demo
mybatis.configuration.map-underscore-to-camel-case=true

# 优先使用 IP 地址，并指定为 localhost
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Eureka 续约配置 - 缩短续约间隔，避免 Eureka 报警告
# 每 5 秒发送一次续约请求（默认 30 秒）
eureka.instance.lease-renewal-interval-in-seconds=5
# 15 秒无续约则过期（默认 90 秒）
eureka.instance.lease-expiration-duration-in-seconds=15

# Actuator 配置
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# 自定义 info 信息
management.info.env.enabled=true
info.app.name=Demo Application
info.app.description=Spring Boot Demo Project
info.app.version=1.0.0

# 首页配置
welcome.page=login.html
